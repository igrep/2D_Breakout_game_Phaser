<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <title>Gamedev Phaser Workshop - lesson 16: Randomizing gameplay</title>
    <style>
    * {
      padding: 0;
      margin: 0;
    }
    </style>
    <script src="js/phaser.min.js"></script>
  </head>
  <body>
    <script>
    let ball;
    let paddle;
    let bricks;
    let scoreText;
    let score = 0;
    let lives = 3;
    let livesText;
    let lifeLostText;
    let playing = false;
    let startButton;

    const config = {
      type: Phaser.AUTO,
      width: 800,
      height: 600,
      scene: {
        preload: preload,
        create: create,
        update: update
      },
      physics: {
        default: 'arcade',
      }
    };

    const game = new Phaser.Game(config);

    function preload () {
      game.scene.scenes[0].load.image('ball', 'img/ball.png');
      game.scene.scenes[0].load.image('paddle', 'img/paddle.png');
      game.scene.scenes[0].load.image('brick', 'img/brick.png');
      game.scene.scenes[0].load.spritesheet('wobble', 'img/wobble.png', {
        frameWidth: 20,
        frameHeight: 20,
      });
      game.scene.scenes[0].load.spritesheet("button", "img/button.png", {
        frameWidth: 120,
        frameHeight: 40,
      });
    }

    function create () {
      const scene = game.scene.scenes[0];
      ball = scene.add.sprite(
        scene.scale.width * 0.5,
        scene.scale.height - 25,
        'ball',
      );
      scene.physics.add.existing(ball);
      ball.body.setCollideWorldBounds(true, 1, 1);
      ball.body.setBounce(1);
      ball.anims.create({
        key: 'wobble',
        frameRate: 24,
        frames: scene.anims.generateFrameNumbers('wobble', {
          frames: [0, 1, 0, 2, 0, 1, 0, 2, 0],
        }),
      });

      paddle = scene.add.sprite(
        scene.scale.width * 0.5,
        scene.scale.height - 5,
        'paddle',
      );
      paddle.setOrigin(0.5, 1);
      scene.physics.add.existing(paddle);
      paddle.body.setImmovable(true);

      scene.physics.world.checkCollision.down = false;
      ball.body.onWorldBounds = true;

      initBricks();

      const textStyle = { font: "18px Arial", fill: "#0095DD" };
      scoreText = scene.add.text(5, 5, "Points: 0", textStyle);

      livesText = scene.add.text(
        scene.scale.width - 5,
        5,
        `Lives: ${lives}`,
        textStyle
      );
      livesText.setOrigin(1, 0);
      lifeLostText = scene.add.text(
        scene.scale.width * 0.5,
        scene.scale.height * 0.5,
        "Life lost, click to continue",
        textStyle,
      );
      lifeLostText.setOrigin(0.5, 0.5);
      lifeLostText.visible = false;

      const BUTTON_FRAME_POINTEROUT = 0;
      const BUTTON_FRAME_POINTEROVER = 1;
      const BUTTON_FRAME_POINTERDOWN = 2;
      startButton = scene.add.sprite(
        scene.scale.width * 0.5,
        scene.scale.height * 0.5,
        "button",
        BUTTON_FRAME_POINTEROUT
      );
      startButton.setInteractive();
      startButton.on("pointerover", () => {
        startButton.setFrame(BUTTON_FRAME_POINTEROVER);
      });
      startButton.on("pointerdown", () => {
        startButton.setFrame(BUTTON_FRAME_POINTERDOWN);
      });
      startButton.on("pointerout", () => {
        startButton.setFrame(BUTTON_FRAME_POINTEROUT);
      });
      startButton.on("pointerup", () => {
        startGame();
      });
    }

    function update () {
      const scene = game.scene.scenes[0];
      scene.physics.collide(ball, paddle, hitPaddle);
      scene.physics.collide(ball, bricks, hitBrick);

      if (playing) {
        paddle.x = scene.input.x || scene.scale.width * 0.5;
      }

      const ballIsOutOfBounds =
        !Phaser.Geom.Rectangle.Overlaps(scene.physics.world.bounds, ball.getBounds());
      if (ballIsOutOfBounds) {
        ballLeaveScreen();
      }
    }

    function startGame () {
      startButton.destroy();
      ball.body.setVelocity(150, -150);
      playing = true;
    }

    function initBricks () {
      const scene = game.scene.scenes[0];
      const bricksLayout = {
        width: 50,
        height: 20,
        count: {
          row: 3,
          col: 7,
        },
        offset: {
          top: 50,
          left: 60,
        },
        padding: 10,
      };

      bricks = scene.add.group();
      for (let c = 0; c < bricksLayout.count.col; c++) {
        for (let r = 0; r < bricksLayout.count.row; r++) {
          const brickX =
            c * (bricksLayout.width + bricksLayout.padding) + bricksLayout.offset.left;
          const brickY =
            r * (bricksLayout.height + bricksLayout.padding) + bricksLayout.offset.top;

          const newBrick = scene.add.sprite(brickX, brickY, "brick");
          scene.physics.add.existing(newBrick);
          newBrick.body.setImmovable(true);
          newBrick.setOrigin(0.5, 0.5);
          bricks.add(newBrick);
        }
      }
    }

    function hitPaddle (ball, paddle) {
      ball.anims.play('wobble');
      ball.body.velocity.x = -5 * (paddle.x - ball.x);
    }

    function hitBrick (ball, brick) {
      const scene = game.scene.scenes[0];
      const destroyTween = scene.tweens.add({
        targets: brick,
        ease: 'Linear',
        repeat: 0,
        duration: 200,
        props: {
          scaleX: 0,
          scaleY: 0,
        },
        onComplete: () => {
          brick.destroy();
        },
      });
      destroyTween.play();
      score += 10;
      scoreText.setText(`Points: ${score}`);

      if (bricks.countActive() === 0) {
        alert("You won the game, congratulations!");
        location.reload();
      }
    }

    function ballLeaveScreen () {
      const scene = game.scene.scenes[0];
      lives--;
      if (lives > 0) {
        livesText.setText(`Lives: ${lives}`);
        lifeLostText.visible = true;
        ball.body.reset(scene.scale.width * 0.5, scene.scale.height - 25);
        scene.input.once("pointerdown", () => {
          lifeLostText.visible = false;
          ball.body.setVelocity(150, -150);
        });
      } else {
        alert("Game over!");
        location.reload();
      }
    }
    </script>
  </body>
</html>
